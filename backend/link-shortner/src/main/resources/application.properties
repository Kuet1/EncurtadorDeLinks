quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Migration configs: flyway build schemas from migrations and hibernate validate them
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
%dev.quarkus.hibernate-orm.log.sql=true

# Production database: values come from hosting environment
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}

# CORS: only the Netlify frontend may call the API from a browser
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=https://linksshortenerproject.netlify.app
quarkus.http.cors.methods=POST,GET,DELETE
quarkus.http.cors.access-control-allow-credentials=false
